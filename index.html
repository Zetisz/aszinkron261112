<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>async</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
</head>
<body>
    <form id="form">
        <div class="row">
            <div class="col">
                <input type="text" id="name" name="name" placeholder="Name" class="form-control" required>
            </div>
            <div class="col">
                <input type="text" id="value" name="value" placeholder="Value" class="form-control" required>
            </div>
            <div class="col">
                <input type="text" id="color" name="color" placeholder="Text Color" class="form-control" required>
            </div>
            <div class="col">
                <button type="submit" class="btn btn-primary">Add</button>
            </div>
        </div>
    </form>

    <main class="d-flex flex-wrap">
        <h1 id="welcome">Welcome to our paint shop. Please wait a few seconds to see our paint selection...</h1>
    </main>

    <script src="main.js"></script>
</body>
</html>
